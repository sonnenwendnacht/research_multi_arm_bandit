name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[tuning]'
      - run: python -m unittest discover -s tests -v
      - run: python -m bandit_cost_quality compare --scenario scenarios/file_1.json --horizon 100 --seeds 0 1 --output results/smoke.json
