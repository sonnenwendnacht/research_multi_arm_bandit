[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandit-cost-quality"
version = "0.1.0"
description = "Reproducible fixed-threshold Gaussian bandit research demonstrations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
tuning = ["scikit-optimize>=0.10.2,<0.11"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
bandit-cost-quality = "bandit_cost_quality.cli:main"

[tool.setuptools.packages.find]
include = ["bandit_cost_quality*"]
